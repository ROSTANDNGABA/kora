{# Carte catégorie. Paramètres : name, icon, color, href (si vide, la carte n'est pas cliquable) #}
{% if href %}<a href="{{ href }}" class="card card-hover flex flex-col items-center gap-3 p-4 text-center">{% else %}<div class="card flex flex-col items-center gap-3 p-4 text-center">{% endif %}
  <span class="flex h-14 w-14 items-center justify-center rounded-2xl text-white shadow-soft" style="background-color: {{ color|default:'#F36F21' }}">
    <i data-lucide="{{ icon|default:'sparkles' }}" class="h-7 w-7"></i>
  </span>
  <span class="text-sm font-semibold leading-tight">{{ name }}</span>
{% if href %}</a>{% else %}</div>{% endif %}
