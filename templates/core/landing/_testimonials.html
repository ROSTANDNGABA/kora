{% load i18n %}
{% if testimonials %}
<section id="avis" class="scroll-mt-20 px-4 py-16 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <h2 class="text-2xl sm:text-3xl">{% trans "Ce que disent les clients" %}</h2>
    <p class="mt-1 text-kora-brown/70">{% trans "Les derniers avis publiés après une prestation terminée." %}</p>
    <div class="mt-8 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      {% for r in testimonials %}
      <figure data-reveal style="--d: {{ forloop.counter0 }}" class="card flex flex-col p-6">
        {% include "components/stars.html" with rating=r.rating %}
        <blockquote class="mt-3 flex-1 text-sm leading-relaxed text-kora-brown/80">{{ r.comment }}</blockquote>
        <figcaption class="mt-4 flex items-center gap-3 text-sm">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-kora-orange-100 text-xs font-bold text-kora-orange-700">{{ r.client.public_name|slice:":1" }}</span>
          <span><span class="font-semibold">{{ r.client.public_name }}</span><span class="block text-xs text-kora-brown/60">{% trans "à propos de" %} {{ r.provider.business_name }}</span></span>
        </figcaption>
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
