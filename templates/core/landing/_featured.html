{% load i18n %}
{% if featured %}
<section id="artisans" class="scroll-mt-20 bg-white px-4 py-16 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <div class="mb-8 flex flex-col justify-between gap-2 sm:flex-row sm:items-end">
      <div>
        <h2 class="text-2xl sm:text-3xl">{% trans "Artisans à découvrir" %}</h2>
        <p class="mt-1 text-kora-brown/70">{% trans "Une sélection de l'équipe Kora." %}</p>
      </div>
      <a href="{% url 'catalog:search' %}" class="text-sm font-semibold text-kora-orange-600 hover:underline">{% trans "Voir tous les artisans" %} &rarr;</a>
    </div>
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      {% for p in featured %}<div data-reveal style="--d: {{ forloop.counter0 }}">{% include "components/provider_card.html" with p=p %}</div>{% endfor %}
    </div>
  </div>
</section>
{% endif %}
