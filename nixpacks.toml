# Configuration Nixpacks pour Railway (Node.js + Python multi-runtime)
[phases.setup]
nixPkgs = ["python3", "nodejs_20"]

[phases.install]
cmds = [
  "npm install",
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "npm run build",
  "python manage.py collectstatic --no-input"
]

[start]
cmd = "bash ./start.sh"
