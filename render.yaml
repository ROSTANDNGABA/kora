databases:
  - name: kora-db
    databaseName: kora
    user: kora
    region: frankfurt
    plan: free

services:
  - type: web
    name: kora-app
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: NODE_VERSION
        value: 20.18.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: kora-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      # Envoi réel des e-mails (OTP). Render bloque le SMTP sortant en plan
      # gratuit : utiliser l'API Brevo (port 443) — 300 e-mails/jour gratuits.
      # EMAIL_BACKEND=apps.core.email_backends.BrevoEmailBackend
      # BREVO_API_KEY=xkeysib-...
      # DEFAULT_FROM_EMAIL=Kora <albertngaba@gmail.com>
      # Alternative SMTP (Railway, local…) :
      # EMAIL_HOST=smtp.gmail.com
      # EMAIL_PORT=587
      # EMAIL_USE_TLS=True
      # EMAIL_HOST_USER=albertngaba@gmail.com
      # EMAIL_HOST_PASSWORD=secret (mot de passe d'application Google)
      - key: SMS_BACKEND
        value: "console"
      - key: SEED_DEMO
        value: "true"
