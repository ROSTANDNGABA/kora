databases:
  - name: kora-db
    databaseName: kora
    user: kora
    region: frankfurt
    plan: free

services:
  - type: web
    name: kora-app
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: NODE_VERSION
        value: 20.18.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: kora-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: SMS_BACKEND
        value: "console"
      - key: SEED_DEMO
        value: "true"
